{% extends panel_base %}
{% block titulo %}Mesa{% endblock %}
{% block cabecera %}{% if editando %}Editar mesa{% else %}Nueva mesa{% endif %}{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-prim" type="submit">Guardar</button>
    <a class="btn btn-sec" href="{% url 'ventas:mesas_lista' %}">Volver</a>
  </form>
</div>
{% endblock %}
