<div class="campo{% if campo.errors %} con-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="req" title="Obligatorio">*</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<small class="ayuda">{{ campo.help_text }}</small>{% endif %}
  {% for e in campo.errors %}<small class="error" role="alert">{{ e }}</small>{% endfor %}
</div>
